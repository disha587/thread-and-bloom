<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Thread & Bloom</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fdf8f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .thank-you-box {
            background: white;
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        .check {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="thank-you-box">

        <div class="check">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your order has been submitted successfully.
        </p>

        <p>
            We have received your details and will contact you soon.
        </p>

        <a href="index.html" class="back-btn">
            Back to Thread & Bloom
        </a>

    </div>

</body>
</html>
